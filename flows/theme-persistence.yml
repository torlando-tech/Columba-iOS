appId: network.columba.Columba
name: theme-persistence
tags:
  - regression
  - screenshot
---
# Verify color-scheme and preset selections after the app's intentional
# themeVersion root rebuild, then again after process termination and relaunch.
- launchApp:
    clearState: true
    clearKeychain: true
    arguments:
      ui-screenshotter: true
- extendedWaitUntil:
    visible:
      id: "screen_chats"
    timeout: 30000
- tapOn:
    id: "tab_settings|gearshape.fill"
- extendedWaitUntil:
    visible:
      id: "screen_settings"
    timeout: 10000
- scrollUntilVisible:
    element:
      text: "Appearance"
    direction: DOWN
    timeout: 20000
- tapOn:
    text: "Appearance"
- extendedWaitUntil:
    visible:
      id: "appearance_color_scheme_light"
    timeout: 10000
- tapOn:
    id: "appearance_color_scheme_light"

# Changing the scheme rebuilds the root and returns to Chats. Reopen Appearance
# and prove Light is selected before choosing the Ocean preset.
- extendedWaitUntil:
    visible:
      id: "screen_chats"
    timeout: 10000
- tapOn:
    id: "tab_settings|gearshape.fill"
- extendedWaitUntil:
    visible:
      id: "screen_settings"
    timeout: 10000
- scrollUntilVisible:
    element:
      text: "Appearance"
    direction: DOWN
    timeout: 20000
- tapOn:
    text: "Appearance"
- extendedWaitUntil:
    visible:
      id: "appearance_color_scheme_light_selected"
    timeout: 10000
- scrollUntilVisible:
    element:
      id: "appearance_theme_ocean"
    direction: DOWN
    timeout: 20000
- tapOn:
    id: "appearance_theme_ocean"

# Preset selection also rebuilds the root. Reopen and prove Ocean is selected.
- extendedWaitUntil:
    visible:
      id: "screen_chats"
    timeout: 10000
- tapOn:
    id: "tab_settings|gearshape.fill"
- extendedWaitUntil:
    visible:
      id: "screen_settings"
    timeout: 10000
- scrollUntilVisible:
    element:
      text: "Appearance"
    direction: DOWN
    timeout: 20000
- tapOn:
    text: "Appearance"
- extendedWaitUntil:
    visible:
      id: "appearance_color_scheme_light_selected"
    timeout: 10000
- scrollUntilVisible:
    element:
      id: "appearance_theme_ocean_selected"
    direction: DOWN
    timeout: 20000

# Relaunch without clearing state so the new ThemeManager restores the record.
- killApp
- launchApp:
    stopApp: false
- extendedWaitUntil:
    visible:
      id: "screen_chats"
    timeout: 30000
- tapOn:
    id: "tab_settings|gearshape.fill"
- extendedWaitUntil:
    visible:
      id: "screen_settings"
    timeout: 10000
- scrollUntilVisible:
    element:
      text: "Appearance"
    direction: DOWN
    timeout: 20000
- tapOn:
    text: "Appearance"
- extendedWaitUntil:
    visible:
      id: "appearance_color_scheme_light_selected"
    timeout: 10000
- scrollUntilVisible:
    element:
      id: "appearance_theme_ocean_selected"
    direction: DOWN
    timeout: 20000
- takeScreenshot: "theme-persistence"
