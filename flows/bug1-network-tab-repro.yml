appId: network.columba.Columba
name: bug1-network-tab-repro
tags:
  - debug
---
# Reproduces BUG #1: open the "ReadProbe" (a65eb058) conversation via the
# Contacts → Network tab path (which showed empty), then via the Chats path
# (which worked). Each open fires `[MSG] loadMessages records=/loaded=` in
# diag.log; screenshots capture whether the message bubble actually renders.
# Relies on the probe's recent announce + persisted message (msgs=1).
- launchApp
- waitForAnimationToEnd:
    timeout: 6000

# ---- Path A: Contacts → Network → peer → Start Chat ----
- tapOn:
    text: "Contacts"
    optional: true
- waitForAnimationToEnd:
    timeout: 3000
- tapOn:
    text: "Network"
    optional: true
- waitForAnimationToEnd:
    timeout: 3000
- scrollUntilVisible:
    element:
      text: "ReadProbe"
    direction: DOWN
    timeout: 15000
- tapOn:
    text: "ReadProbe"
- waitForAnimationToEnd:
    timeout: 3000
- tapOn:
    text: "Start Chat"
    optional: true
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: bug1_via_network_tab
- assertVisible:
    text: "read-count probe"
    optional: true

# ---- back to the tab root, then Path B: Chats → conversation ----
- back
- waitForAnimationToEnd:
    timeout: 2000
- back
- waitForAnimationToEnd:
    timeout: 2000
- tapOn:
    text: "Chats"
    optional: true
- waitForAnimationToEnd:
    timeout: 3000
- scrollUntilVisible:
    element:
      text: "ReadProbe"
    direction: DOWN
    timeout: 15000
- tapOn:
    text: "ReadProbe"
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: bug1_via_chats
- assertVisible:
    text: "read-count probe"
    optional: true
