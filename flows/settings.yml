appId: network.columba.Columba
name: settings
tags:
  - smoke
  - screenshot
---
# Open the Settings tab and capture the top of the panel — the most static UI
# surface in the app, ideal for catching unintended typography/theme drift.
- launchApp:
    clearState: true
    clearKeychain: true
- waitForAnimationToEnd:
    timeout: 5000
- runFlow:
    when:
      visible: "Skip"
    commands:
      - tapOn: "Skip"
      - waitForAnimationToEnd:
          timeout: 3000
- runFlow:
    when:
      visible: "Get Started"
    commands:
      - tapOn: "Get Started"
      - waitForAnimationToEnd:
          timeout: 3000
- tapOn:
    text: "Settings"
    optional: true
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: "settings"
