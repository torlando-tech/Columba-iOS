appId: network.columba.Columba
name: settings
tags:
  - smoke
  - screenshot
---
# Open the Settings tab and capture the top of the panel — the most static UI
# surface in the app, ideal for catching unintended typography/theme drift.
- launchApp:
    clearState: true
    clearKeychain: true
    arguments:
      ui-screenshotter: true
- extendedWaitUntil:
    visible:
      id: "screen_chats"
    timeout: 30000
- tapOn:
    text: "Settings"
    optional: true
- extendedWaitUntil:
    visible:
      id: "screen_settings"
    timeout: 10000
- assertVisible:
    id: "screen_settings"
- takeScreenshot: "settings"
