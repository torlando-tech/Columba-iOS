appId: network.columba.Columba
name: map
tags:
  - smoke
  - screenshot
---
# Capture the Map tab. PR #59/#65 changes this view's style URL based on
# system appearance. We screenshot it in the Sim's default light appearance —
# Stage 2 will add a dark-mode capture column.
- launchApp:
    clearState: true
    clearKeychain: true
    arguments:
      ui-screenshotter: true
- extendedWaitUntil:
    visible:
      id: "screen_chats"
    timeout: 30000
- tapOn:
    id: "tab_map|map.fill"
# Wait on MapLibre's native idle signal: no camera transition, all requested
# tiles loaded, and all fade/transition animations complete.
- extendedWaitUntil:
    visible:
      id: "map_canvas_ready"
    timeout: 20000
- assertVisible:
    id: "map_canvas_ready"
- takeScreenshot: "map"
