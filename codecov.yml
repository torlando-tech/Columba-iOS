coverage:
  status:
    project:
      default:
        target: auto    # Don't gate on overall % — only fail if a PR drops it
        threshold: 1%   # Tolerate ±1% drift
    patch:
      default:
        target: 70%     # New / changed lines must be 70% covered
ignore:
  - "Tests/**"
  - "**/*Tests.swift"
  - "**/Generated*"
